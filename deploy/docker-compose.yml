# Despliegue de un nodo: API + trabajador + Caddy (HTTPS automático con Let's Encrypt).
services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment: { INLINE_WORKER: "false" }
    volumes: [ "datos:/data", "../models:/models:ro" ]
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    command: ["python", "-m", "app.worker"]
    volumes: [ "datos:/data", "../models:/models:ro" ]
    restart: unless-stopped
    # Con GPU NVIDIA (requiere nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ]

  caddy:
    image: caddy:2
    ports: [ "80:80", "443:443" ]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data" ]
    environment: { DOMAIN: "${DOMAIN:-localhost}" }
    restart: unless-stopped

volumes:
  datos:
  caddy_data:
